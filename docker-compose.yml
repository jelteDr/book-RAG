# dev-Profil: Qdrant + Backend im Container, Ollama läuft NATIV auf dem Host (Metal).
# Voraussetzung: Host-Ollama muss auf 0.0.0.0 lauschen, sonst ist es aus dem Container
# nicht erreichbar:  launchctl setenv OLLAMA_HOST 0.0.0.0:11434  (Ollama neu starten).
#
# Werte werden aus .env interpoliert (falls vorhanden), sonst greifen die Defaults.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # TCP-Probe auf den REST-Port (kein curl im Image nötig; debian-slim hat bash).
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        # true -> torch/sentence-transformers ins Image (fuer Reranker/Faithfulness).
        INSTALL_ML_EXTRAS: ${INSTALL_ML_EXTRAS:-false}
    ports:
      # Host-Port 8001 (8000 ist auf diesem Rechner belegt); Container-intern bleibt 8000.
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      # host.docker.internal zeigt dank extra_hosts auf den Host (auch unter Linux).
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - CHAT_MODEL=${CHAT_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-book_chunks}
      - TOP_K=${TOP_K:-8}
      # Opt-in-Qualitaets-Services (brauchen INSTALL_ML_EXTRAS=true beim Build).
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - FAITHFULNESS_CHECK_ENABLED=${FAITHFULNESS_CHECK_ENABLED:-false}
      # Opt-in Contextual Ingestion (Exp 5): LLM-Kontext je Chunk beim Upload (~4-6 s/Chunk).
      - CONTEXTUAL_INGEST_ENABLED=${CONTEXTUAL_INGEST_ENABLED:-false}
      # Opt-in Small-to-Big (Exp 7): Top-Treffer um Nachbar-Chunks erweitern (vorher: make ollama-ctx).
      - SMALL_TO_BIG_ENABLED=${SMALL_TO_BIG_ENABLED:-false}
      - S2B_WINDOW=${S2B_WINDOW:-1}
      - S2B_TOP_N=${S2B_TOP_N:-3}
      # Opt-in Graph-RAG (Exp 8): Graph liegt im ./data-Volume unter /data/graph/<Gruppe>/.
      - GRAPH_RAG_ENABLED=${GRAPH_RAG_ENABLED:-false}
      - GRAPH_RAG_MODE=${GRAPH_RAG_MODE:-link}
      - GRAPH_ALPHA=${GRAPH_ALPHA:-0.03}
      - GRAPH_TOP_M=${GRAPH_TOP_M:-5}
      - GRAPH_MIN_SIM=${GRAPH_MIN_SIM:-0.45}
      - GRAPH_DIR=/data/graph
      - DATABASE_URL=postgresql+asyncpg://bookrag:bookrag@postgres:5432/bookrag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      # HuggingFace-Cache persistieren: Reranker/NLI-Modelle (~2 GB) ueberleben Rebuilds.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bookrag
      - POSTGRES_PASSWORD=bookrag
      - POSTGRES_DB=bookrag
    ports:
      # Host-Port 5433 (5432 evtl. belegt); Container-intern bleibt 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrag -d bookrag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_storage:
  postgres_data:
  hf_cache:
