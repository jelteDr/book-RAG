[project]
name = "book-rag-backend"
version = "0.1.0"
description = "FastAPI-Backend für die book-RAG-Anwendung (Retrieval, Streaming-Chat, Ingestion)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "qdrant-client>=1.12",
    "python-multipart>=0.0.12",   # Datei-Uploads (Ingestion, M1/M3)
    "charset-normalizer>=3.4",    # Encoding-Sniffing (Cleaning, M1)
    "sqlmodel>=0.0.22",           # ORM (SQLAlchemy 2.0 + Pydantic) für PostgreSQL
    "asyncpg>=0.30",              # async PostgreSQL-Treiber
    "greenlet>=3.0",             # von SQLAlchemy-async benötigt
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
# Optional: Cross-Encoder-Reranker. Schwer (torch) -> nicht im Standard-Image.
# Installieren mit:  uv sync --group reranker
reranker = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
