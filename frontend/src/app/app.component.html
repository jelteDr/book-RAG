<div class="flex flex-col h-screen">
  <nav class="flex items-center gap-4 px-4 py-3 border-b border-edge">
    <span class="font-semibold">book-RAG</span>
    <a
      routerLink="/chat"
      routerLinkActive="text-accent"
      class="text-sm text-muted hover:text-ink"
      >Chat</a
    >
    <a
      routerLink="/groups"
      routerLinkActive="text-accent"
      class="text-sm text-muted hover:text-ink"
      >Dokumente</a
    >
    <a
      routerLink="/models"
      routerLinkActive="text-accent"
      class="text-sm text-muted hover:text-ink"
      >Modelle</a
    >
    <a
      routerLink="/dashboard"
      routerLinkActive="text-accent"
      class="text-sm text-muted hover:text-ink"
      >Dashboard</a
    >
    <button
      class="ml-auto text-sm text-muted hover:text-ink border border-edge rounded-md px-2 py-1"
      (click)="theme.toggle()"
      [title]="theme.theme() === 'dark' ? 'Zu Light-Mode wechseln' : 'Zu Dark-Mode wechseln'"
    >
      {{ theme.theme() === 'dark' ? '☀︎ Light' : '☾ Dark' }}
    </button>
  </nav>
  <main class="flex-1 min-h-0">
    <router-outlet></router-outlet>
  </main>
</div>
