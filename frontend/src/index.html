<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>book-RAG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Theme vor dem ersten Rendern setzen, damit nichts aufblitzt (siehe src/app/theme.service.ts)
      ;(function () {
        var mode = 'system'
        try {
          mode = localStorage.getItem('bookrag-theme') || 'system'
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
